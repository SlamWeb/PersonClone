name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[all,dev]"
      - name: Check committed files for secrets and private data
        run: python scripts/check_no_secrets.py
      - name: Run Python tests
        run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-first-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image from a clean checkout
        run: docker build -t personaforge:ci .
      - name: Start with empty data, no model cache, and no API key
        run: docker run -d --name personaforge-ci -p 8000:8000 personaforge:ci
      - name: Verify startup diagnostics and Web UI
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          health = None
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3) as response:
                      health = json.load(response)
                  break
              except Exception:
                  time.sleep(2)
          if health is None:
              raise SystemExit("Web service did not become ready")
          assert health["status"] == "degraded", health
          checks = {item["check_id"]: item for item in health["preflight"]["checks"]}
          assert checks["llm_api_key"]["status"] == "error", checks
          assert checks["embedding_model"]["status"] in {"warning", "ready"}, checks
          with urllib.request.urlopen("http://127.0.0.1:8000/", timeout=3) as response:
              html = response.read().decode("utf-8")
          assert "<html" in html.lower()
          print(json.dumps(health, ensure_ascii=False, indent=2))
          PY
      - name: Print container logs on failure
        if: failure()
        run: docker logs personaforge-ci
      - if: always()
        run: docker rm -f personaforge-ci || true
